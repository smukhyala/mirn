<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img"
     aria-label="One person's two paths: the run with the robot and the run without">
  <!--
    The site's one idea, at sixteen pixels: the same person, twice.

    The filled dot is a person in the run WITH the robot; the hollow one is that same person in the
    run without it; the rule between them is the distance the robot moved them, which is the only
    quantity this bench claims to measure. It is the arena's own legend with everything else
    removed, so a reader who has seen the console recognises the mark and a reader who has not is
    told nothing false by it.

    The two colours are written out here, and this is the ONE place in the repository where that is
    allowed. Every other colour comes from web/ui/theme.ts, injected at runtime by
    web/app/console/boot.js — but a favicon is fetched by the browser chrome before any script
    runs and has no stylesheet behind it, so a token here would resolve to nothing. They are
    PALETTE.ink and PALETTE.paper, copied, and `favicon.test.ts` asserts they still match rather
    than trusting this comment.
  -->
  <rect width="32" height="32" fill="#fdfcfa"/>
  <line x1="11" y1="16" x2="21" y2="16" stroke="#111111" stroke-width="1.5"/>
  <circle cx="9" cy="16" r="4" fill="#111111"/>
  <circle cx="23" cy="16" r="3.25" fill="none" stroke="#111111" stroke-width="1.5"/>
</svg>
