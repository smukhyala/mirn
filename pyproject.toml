[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mirn"
version = "0.1.0"
description = "The measurement oracle behind MIRN, an interactive notebook about perturbation."
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "scipy",
    "pandas",
    "matplotlib",
    "python-dotenv",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "hypothesis",
    "ruff",
]

[project.scripts]
mirn = "mirn.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    # The split-half nulls and the Sinkhorn solver dominate the suite's runtime, so
    # `.venv/bin/python -m pytest -q -m "not slow"` serves the tight loop and the full suite runs
    # before a push. A pre-commit gate nobody runs because it takes six minutes is not a gate.
    #
    # This marker existed for a while with nothing wearing it, which made the loop above a comment
    # rather than a command. The tests that wear it now were chosen by measurement, not by feel:
    # `pytest --durations=0`, everything costing more than about 2.5 s. As measured, that is 23
    # tests of 297, and 335 s of a 356 s full run; the remaining 274 take 20 s.
    #
    # The fast loop cannot go much below that, and the reason is worth knowing before you
    # try. `cached_floor` and `cached_null_samples` are LRU-cached, so one split-half computation
    # is shared across a family of tests in test_experiments.py and whichever of them runs first
    # pays about 8 s for it. Deselecting that one only hands the bill to the next, which is why
    # they are not marked: they are cheap tests behind an expensive fixture, not slow tests.
    #
    # What the fast loop gives up, so nobody discovers it by surprise: the hypothesis property
    # tests over the divergences, and the calibration suite. `tests/test_placebo.py` is a gate and
    # is deliberately unmarked, so it runs in both.
    "slow: over ~2.5 s measured with --durations; skipped by the pre-commit loop, never in CI",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# ruff's default select is E4, E7, E9, F — which omits E501 (line-too-long),
# so line-length was configured but never enforced. Select it explicitly.
select = ["E4", "E7", "E9", "F", "E501"]
