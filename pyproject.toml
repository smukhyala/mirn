[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mirn"
version = "0.1.0"
description = "A measurement instrument for robot-induced perturbation of pedestrian motion."
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "scipy",
    "pandas",
    "matplotlib",
    "python-dotenv",
]

[project.optional-dependencies]
app = [
    "fastapi",
    "uvicorn[standard]",
]
dev = [
    "pytest",
    "hypothesis",
    "ruff",
    "httpx",
]

[project.scripts]
mirn = "mirn.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mirn_app = ["static/*", "static/vendor/katex/*", "static/vendor/katex/fonts/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Task 13: importing `fastapi.testclient` (which re-exports `starlette.testclient.TestClient`)
# unconditionally emits this warning under the installed starlette/httpx combination, regardless
# of any code in this repo -- it fires on `import starlette.testclient` alone, before any test
# runs. Starlette's suggested fix is a separate `httpx2` package, which is a new dependency this
# project does not add. Ignore only this exact, known, pre-existing warning; nothing else here is
# suppressed.
filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient` is deprecated:starlette.exceptions.StarletteDeprecationWarning",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# ruff's default select is E4, E7, E9, F — which omits E501 (line-too-long),
# so line-length was configured but never enforced. Select it explicitly.
select = ["E4", "E7", "E9", "F", "E501"]
