[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mirn"
version = "0.1.0"
description = "A measurement instrument for robot-induced perturbation of pedestrian motion."
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "scipy",
    "pandas",
    "matplotlib",
    "python-dotenv",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "hypothesis",
    "ruff",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# ruff's default select is E4, E7, E9, F — which omits E501 (line-too-long),
# so line-length was configured but never enforced. Select it explicitly.
select = ["E4", "E7", "E9", "F", "E501"]
