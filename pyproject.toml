[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mirn"
version = "0.1.0"
description = "The measurement oracle behind MIRN, an interactive notebook about perturbation."
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "scipy",
    "pandas",
    "matplotlib",
    "python-dotenv",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "hypothesis",
    "ruff",
]

[project.scripts]
mirn = "mirn.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    # The split-half nulls and the Sinkhorn solver dominate the suite's runtime. Marking them lets
    # `pytest -q -m "not slow"` serve the tight loop while the full suite runs before a push. A
    # pre-commit gate nobody runs because it takes five minutes is not a gate.
    "slow: computations heavy enough to be worth skipping in a pre-commit run",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# ruff's default select is E4, E7, E9, F — which omits E501 (line-too-long),
# so line-length was configured but never enforced. Select it explicitly.
select = ["E4", "E7", "E9", "F", "E501"]
