name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# The deploy step mints an OIDC token to publish; these three are the minimum it needs.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time. Queued runs are not cancelled, so a slow deploy finishes
# rather than being killed by the next push.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      # Vite's root is web/ and its outDir is ../dist, so this writes the repo-root dist/.
      # `base` stays "./": the emitted asset paths resolve against the document URL, which is
      # what makes the same build work at a project subpath, at a domain root and from a file.
      - run: npm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
