name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  # The two languages are checked independently and then against each other. Splitting them means
  # a TypeScript typo does not wait six minutes for the Python suite to agree it is unrelated.
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npx vitest run
      - name: Build the notes
        # This is where the prose lints, the vocabulary ladder and the quantity references are
        # checked. A number the facts file cannot support fails here.
        run: npm run notes
      - run: npx vite build

  oracle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - run: python -m ruff check src tests
      - run: python -m pytest -q

  parity:
    # The check no human remembers to run: that the browser still reproduces the oracle's answers,
    # and that the committed fixtures are what the current code produces.
    needs: [web, oracle]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: npm ci
      - run: pip install -e ".[dev]"
      - name: Fixtures are current
        run: |
          python -m mirn.cli fixtures --out /tmp/fresh
          diff -r tests/golden/parity /tmp/fresh
      - name: The browser reproduces them
        run: npx vitest run web/engine/measure/__tests__/parity.test.ts
